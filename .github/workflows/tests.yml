name: Backend and retrieval tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rawberry_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rawberry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      USE_MOCK_CHAT: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rawberry_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r rawberry-api/requirements.txt
      - run: python -m pytest tests rawberry-api/tests -p no:cacheprovider
